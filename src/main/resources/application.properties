spring.application.name=mecash

# ----------------------------------------------------------------------------
# Datasource: H2 in-memory by default so the app runs with zero setup.
# For PostgreSQL run with: --spring.profiles.active=postgres (see application-postgres.properties)
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:mecash;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ----------------------------------------------------------------------------
# Application settings (bound to MecashProperties)
# ----------------------------------------------------------------------------
# Override the JWT secret in every real environment, e.g. via MECASH_JWT_SECRET.
mecash.jwt.secret=${MECASH_JWT_SECRET:change-me-dev-only-secret-please-override-in-prod}
mecash.jwt.expiration-ms=86400000

# Opening balance credited to each newly created account (must be > 0).
mecash.account.opening-balance=1000.00

# Today's reference exchange rate: 1 unit of A buys this many units of B.
mecash.exchange.rate-a-to-b=1.3455

# ----------------------------------------------------------------------------
# OpenAPI / Swagger UI (SpringDoc). Defaults are fine; pinned here for clarity.
# Spec:       /v3/api-docs
# Swagger UI: /swagger-ui.html
# ----------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
