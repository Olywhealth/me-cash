# PostgreSQL profile. Activate with: --spring.profiles.active=postgres
# All values are environment-overridable; defaults target a local Postgres on 5432.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mecash}
spring.datasource.username=${DB_USERNAME:oyekunle}
spring.datasource.password=${DB_PASSWORD:johnson}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
