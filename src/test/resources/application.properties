spring.application.name=mecash

# In-memory H2, freshly built and dropped per test run.
spring.datasource.url=jdbc:h2:mem:mecash-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

mecash.jwt.secret=test-only-secret-test-only-secret-test-only-secret
mecash.jwt.expiration-ms=86400000
mecash.account.opening-balance=1000.00
mecash.exchange.rate-a-to-b=1.3455
